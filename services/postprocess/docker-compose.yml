# =============================================================================
# Local Development Compose — Gateway + Postprocessing Service + PostgreSQL
# =============================================================================
# Start: docker compose up
# Stop:  docker compose down
# Reset: docker compose down -v (removes database volume)
#
# The Gateway reaches the Postprocessing Service on the internal network only.
# PostgreSQL is provisioned with pg_trgm for fuzzy matching.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Dataset_Store
  # ---------------------------------------------------------------------------
  postgres:
    # pgvector-enabled build of PostgreSQL 16. The stock postgres:16 image does
    # not ship the vector extension, so "CREATE EXTENSION vector" fails and the
    # Hansard schema migration cannot run. This image is otherwise identical to
    # postgres:16, so the existing data volume stays compatible.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postprocess
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: postprocess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-pg-trgm.sql:/docker-entrypoint-initdb.d/01-pg-trgm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postprocess"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Postprocessing Service (Python/FastAPI)
  # ---------------------------------------------------------------------------
  postprocess:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: "0.0.0.0"
      PORT: "8082"
      UVICORN_WORKERS: "1"
      DRAIN_TIMEOUT_SECONDS: "15"
      SERVICE_TOKEN: "local-dev-token"
      DATABASE_URL: "postgresql+psycopg://postprocess:localdev@postgres:5432/postprocess"
      REDIS_URL: "redis://redis:6379"
      # AWS Bedrock — enables LLM correction and Titan embeddings for RAG
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      LLM_ENABLED: "true"
      BEDROCK_MODEL_ID: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      LOG_LEVEL: "debug"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Gateway (Node.js/Express)
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8081"
      HOST: "0.0.0.0"
      POSTPROCESS_MODE: "python"
      POSTPROCESS_URL: "http://postprocess:8082"
      POSTPROCESS_TOKEN: "local-dev-token"
      POSTPROCESS_TIMEOUT_MS: "20000"
      POSTPROCESS_BREAKER_THRESHOLD: "5"
      POSTPROCESS_BREAKER_COOLDOWN_MS: "30000"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "8081:8081"
    depends_on:
      postprocess:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
