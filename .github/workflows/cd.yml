name: CD (build + deploy to EC2)

# Deliberate, versioned releases. Push a tag like v1.2.0 to deploy.
# No registry (cost-free): images are built in CI, shipped to the EC2 host over
# SSH, loaded, and deployed with a health-gated auto-rollback.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to the triggering tag)"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.ref_name }}
  REMOTE_DIR: /opt/parliament

jobs:
  build:
    name: Build arm64 images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Hansard frontend (pinned)
        uses: actions/checkout@v4
        with:
          repository: bigdataghana/Hansard
          ref: ${{ vars.HANSARD_REF || 'feat/qa-assistant-recommendations' }}
          path: frontend
          token: ${{ secrets.HANSARD_PAT || github.token }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build gateway (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: parliament-gateway:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_COGNITO_DOMAIN=${{ vars.COGNITO_DOMAIN }}
            VITE_COGNITO_CLIENT_ID=${{ vars.COGNITO_CLIENT_ID }}
            VITE_COGNITO_REDIRECT_URI=${{ vars.COGNITO_REDIRECT_URI }}
            VITE_COGNITO_LOGOUT_URI=${{ vars.COGNITO_LOGOUT_URI }}
            VITE_COGNITO_REGION=us-east-1

      - name: Build postprocess (arm64)
        uses: docker/build-push-action@v6
        with:
          context: services/postprocess
          platforms: linux/arm64
          push: false
          load: true
          tags: parliament-postprocess:${{ env.IMAGE_TAG }}

      - name: Export images
        run: |
          docker save parliament-gateway:${{ env.IMAGE_TAG }}     -o gateway.tar
          docker save parliament-postprocess:${{ env.IMAGE_TAG }} -o postprocess.tar

      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ env.IMAGE_TAG }}
          retention-days: 3
          path: |
            gateway.tar
            postprocess.tar
            deploy-aws/docker-compose.prod.yml
            deploy-aws/docker-compose.ship.yml
            deploy-aws/Caddyfile.prod

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ env.IMAGE_TAG }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy artifacts to host
        run: |
          HOST="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          ssh -i ~/.ssh/id_ed25519 "$HOST" "mkdir -p ${REMOTE_DIR}/releases/${IMAGE_TAG}"
          scp -i ~/.ssh/id_ed25519 gateway.tar postprocess.tar \
            docker-compose.prod.yml docker-compose.ship.yml Caddyfile.prod \
            "$HOST:${REMOTE_DIR}/releases/${IMAGE_TAG}/"

      - name: Deploy with health gate + auto-rollback
        run: |
          HOST="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          ssh -i ~/.ssh/id_ed25519 "$HOST" IMAGE_TAG="${IMAGE_TAG}" REMOTE_DIR="${REMOTE_DIR}" bash -s <<'REMOTE'
          set -euo pipefail
          cd "${REMOTE_DIR}"

          # Record the currently-deployed image ids for rollback
          PREV_GW=$(docker image inspect parliament-gateway:current --format '{{.Id}}' 2>/dev/null || echo "")
          PREV_PP=$(docker image inspect parliament-postprocess:current --format '{{.Id}}' 2>/dev/null || echo "")

          # Load the new images and tag them :current (the compose ship file
          # references parliament-*:current)
          docker load -i "releases/${IMAGE_TAG}/gateway.tar"
          docker load -i "releases/${IMAGE_TAG}/postprocess.tar"
          docker tag parliament-gateway:${IMAGE_TAG}     parliament-gateway:current
          docker tag parliament-postprocess:${IMAGE_TAG} parliament-postprocess:current

          # Refresh compose/Caddy config from the release
          cp "releases/${IMAGE_TAG}/docker-compose.prod.yml" ./docker-compose.prod.yml
          cp "releases/${IMAGE_TAG}/docker-compose.ship.yml" ./docker-compose.ship.yml
          cp "releases/${IMAGE_TAG}/Caddyfile.prod" ./Caddyfile.prod

          docker compose -f docker-compose.prod.yml -f docker-compose.ship.yml up -d

          # Health gate: poll /health up to 24 * 5s = 2 min
          ok=0
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done

          if [ "$ok" != "1" ]; then
            echo "::error::Health check failed — rolling back"
            if [ -n "$PREV_GW" ]; then docker tag "$PREV_GW" parliament-gateway:current; fi
            if [ -n "$PREV_PP" ]; then docker tag "$PREV_PP" parliament-postprocess:current; fi
            docker compose -f docker-compose.prod.yml -f docker-compose.ship.yml up -d
            exit 1
          fi

          echo "Deploy healthy. Pruning old release tarballs (keep last 3)."
          ls -1dt releases/*/ | tail -n +4 | xargs -r rm -rf
          docker image prune -f >/dev/null 2>&1 || true
          REMOTE

      - name: Verify public endpoint
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.PUBLIC_HOST }}/health" || echo 000)
            if [ "$code" = "200" ]; then echo "public /health OK"; exit 0; fi
            sleep 5
          done
          echo "::error::public health check failed"; exit 1
