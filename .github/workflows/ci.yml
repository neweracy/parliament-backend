name: CI

# ADVISORY quality + security checks. These run on every push/PR and produce a
# report in the Actions summary, but they DO NOT block the deploy — the CD
# pipeline ships regardless. The dev reviews the report and fixes issues.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + Security (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Each check is non-blocking (continue-on-error) and its result is
      # captured for the report below.
      - name: Lint (backend)
        id: lint
        continue-on-error: true
        run: pnpm run lint 2>&1 | tee lint.log

      - name: Unit tests (backend)
        id: test
        continue-on-error: true
        run: pnpm test 2>&1 | tee test.log

      - name: Security audit (pnpm)
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level moderate 2>&1 | tee audit.log

      - name: Build report for the developer
        if: always()
        run: |
          {
            echo "# CI Report (advisory — does not block deploy)"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Lint | ${{ steps.lint.outcome == 'success' && '✅ pass' || '⚠️ issues — see log' }} |"
            echo "| Unit tests | ${{ steps.test.outcome == 'success' && '✅ pass' || '⚠️ failures — see log' }} |"
            echo "| Security audit | ${{ steps.audit.outcome == 'success' && '✅ clean' || '⚠️ advisories — see log' }} |"
            echo ""
            if [ "${{ steps.lint.outcome }}" != "success" ]; then
              echo "<details><summary>Lint output</summary>"; echo ""; echo '```'; tail -n 100 lint.log; echo '```'; echo "</details>"; echo ""
            fi
            if [ "${{ steps.test.outcome }}" != "success" ]; then
              echo "<details><summary>Test output</summary>"; echo ""; echo '```'; tail -n 100 test.log; echo '```'; echo "</details>"; echo ""
            fi
            if [ "${{ steps.audit.outcome }}" != "success" ]; then
              echo "<details><summary>Security audit</summary>"; echo ""; echo '```'; tail -n 100 audit.log; echo '```'; echo "</details>"; echo ""
            fi
            echo "> The deploy proceeds regardless. Please fix any ⚠️ items above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs (artifact for the developer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-${{ github.run_id }}
          retention-days: 14
          path: |
            lint.log
            test.log
            audit.log

      # This job NEVER fails — it is advisory only. The report is the output.
